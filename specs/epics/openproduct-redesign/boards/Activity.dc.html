<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Activity</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&amp;family=Lora:wght@400;500&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
:root{color-scheme:light}body{margin:0;background:#F6F4EE}
a{color:#8A6420}a:hover{color:#5E4415}
@media (prefers-reduced-motion: reduce){header *{transition-duration:0.01ms !important}}
</style>
</helmet>
<div style="background-color: #F6F4EE; background-image: radial-gradient(1100px 460px at 50% -8%, rgba(184,134,47,0.18), transparent 62%), radial-gradient(rgba(20,20,19,0.07) 1px, transparent 1.2px); background-size: auto, 22px 22px; color: #141413; font-family: 'Hanken Grotesk', system-ui, sans-serif; font-size: 15px; line-height: 1.5; min-height: 100%; display: flex; flex-direction: column">

<header style="position: sticky; top: 0; z-index: 5; width: 100%; background: rgba(255,255,255,0.62); backdrop-filter: saturate(160%) blur(16px); -webkit-backdrop-filter: saturate(160%) blur(16px); box-shadow: none">
<div style="max-width: 1180px; margin: 0 auto; box-sizing: border-box; padding: 10px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px">
<a href="Feed.dc.html" style="display: flex; align-items: center; gap: 10px; color: #141413; text-decoration: none; font-weight: 600; font-size: 18px; letter-spacing: -0.02em">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3.5V21" stroke="#141413"></path><circle cx="14" cy="9.5" r="6" stroke="#B8862F"></circle></svg>openproduct</a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 2px">
<a href="Feed.dc.html" style="display: flex; align-items: center; min-height: 36px; padding: 0 14px; border-radius: 999px; color: #2B2A27; text-decoration: none; font-weight: 500">Feed</a>
<a href="Products.dc.html" style="display: flex; align-items: center; min-height: 36px; padding: 0 14px; border-radius: 999px; color: #2B2A27; text-decoration: none; font-weight: 500">Products</a>
<a href="Seats.dc.html" style="display: flex; align-items: center; min-height: 36px; padding: 0 14px; border-radius: 999px; color: #2B2A27; text-decoration: none; font-weight: 500">Help wanted</a>
</nav>
<div style="flex: 1 1 280px; display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 10px">
<div style="{{qWrap}}">
<label style="{{qLabel}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6A66" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<span style="position: absolute; left: -9999px">Search</span>
<input type="search" value="{{q}}" onInput="{{setQ}}" placeholder="Search products and people" style="border: 0; outline: 0; background: transparent; color: #141413; font: inherit; font-size: 16px; flex: 1; min-width: 0">
</label>
<div style="{{qCard}}">
<sc-for list="{{qRows}}" as="r" hint-placeholder-count="3">
<div style="{{r.wrap}}">
<a href="{{r.href}}" style="{{r.style}}"><span style="{{r.tile}}">{{r.mono}}</span><span style="flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span><span style="font-size: 13px; color: #6B6A66; flex-shrink: 0">{{r.kind}}</span></a>
<sc-if value="{{r.canExpand}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{r.toggle}}" aria-expanded="{{r.open}}" aria-label="{{r.toggleLabel}}" style="width: 40px; height: 40px; flex-shrink: 0; border: 0; border-radius: 50%; background: transparent; color: #6B6A66; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.chev}}"></path></svg></button></sc-if>
</div>
</sc-for>
<sc-if value="{{qNone}}" hint-placeholder-val="{{false}}"><div style="padding: 12px 10px; font-size: 13px; color: #6B6A66">No matches</div></sc-if>
<a href="Search.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 40px; margin-top: 2px; border-top: 1px solid rgba(20,20,19,0.06); font-size: 13px; font-weight: 600; text-decoration: none">See all results</a>
</div>
</div>
<a href="Activity.dc.html" aria-label="Activity" aria-current="page" style="position: relative; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; background: #141413; color: #FAF9F5">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 0112 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9zM10 20a2 2 0 004 0"></path></svg>
<sc-if value="{{anyUnread}}" hint-placeholder-val="{{true}}"><span aria-hidden="true" style="position: absolute; top: 7px; right: 8px; width: 9px; height: 9px; border-radius: 50%; background: #E3B34C; box-shadow: 0 0 0 2px #141413"></span></sc-if>
</a>
<a href="Me.dc.html" aria-label="Your profile" style="position: relative; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; background: #FFFFFF; color: #6B6A66">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg></a>
</div>
</div>
</header>

<div style="width: 100%; max-width: 760px; margin: 0 auto; box-sizing: border-box; padding: 36px 24px 64px; display: flex; flex-direction: column; gap: 20px">

<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<h1 style="margin: 0; font-family: Lora, Georgia, serif; font-weight: 400; font-size: 40px; line-height: 1.1; letter-spacing: -0.015em">Activity</h1>
<button type="button" onClick="{{markAll}}" disabled="{{noUnread}}" style="{{markStyle}}">Mark all read</button>
</div>

<div role="group" aria-label="Show" style="align-self: flex-start; display: flex; gap: 2px; padding: 4px; border-radius: 999px; background: #FFFFFF; box-shadow: none">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button type="button" onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="{{t.style}}">{{t.label}}</button>
</sc-for>
</div>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<section aria-label="{{g.label}}" style="display: flex; flex-direction: column; gap: 8px">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.12em; color: #6B6A66; padding: 0 6px">{{g.mono}}</div>
<div style="background: #FFFFFF; border-radius: 16px; box-shadow: none; padding: 6px; display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
<div style="{{r.rowStyle}}">
<span style="{{r.tile}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{r.stroke}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.d}}"></path></svg></span>
<div style="flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 15px; color: #2B2A27"><a href="{{r.whoHref}}" style="color: #141413; font-weight: 600; text-decoration: none">{{r.who}}</a> {{r.text}} <a href="{{r.targetHref}}" style="color: #141413; font-weight: 600; text-decoration: none">{{r.target}}</a></div>
<sc-if value="{{r.hasQuote}}" hint-placeholder-val="{{false}}"><div style="font-size: 13px; color: #6B6A66; padding-left: 10px; border-left: 2px solid #ECEAE3">{{r.quote}}</div></sc-if>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #8A877F">{{r.when}}</span>
</div>
<sc-if value="{{r.hasLink}}" hint-placeholder-val="{{false}}"><a href="{{r.linkHref}}" style="display: flex; align-items: center; min-height: 40px; padding: 0 16px; border-radius: 999px; background: #141413; color: #FAF9F5; text-decoration: none; font-size: 13px; font-weight: 600">{{r.linkLabel}}</a></sc-if>
<sc-if value="{{r.pending}}" hint-placeholder-val="{{false}}">
<div style="display: flex; gap: 6px">
<button type="button" onClick="{{r.accept}}" style="min-height: 40px; padding: 0 16px; border: 0; border-radius: 999px; background: #141413; color: #FAF9F5; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Accept</button>
<button type="button" onClick="{{r.decline}}" style="min-height: 40px; padding: 0 16px; border: 0; border-radius: 999px; background: rgba(20,20,19,0.06); color: #2B2A27; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Decline</button>
</div>
</sc-if>
<sc-if value="{{r.decided}}" hint-placeholder-val="{{false}}"><span style="{{r.decidedStyle}}">{{r.decidedLabel}}</span></sc-if>
<span aria-label="{{r.dotLabel}}" style="{{r.dot}}"></span>
</div>
</sc-for>
</div>
</section>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{false}}"><div style="font-size: 15px; color: #6B6A66; padding: 0 6px">Nothing here yet.</div></sc-if>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1200}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'all', read: {}, seat: null };
  }
  searchVals() {
    const q = (this.state || {}).q || '';
    const exp = (this.state || {}).qExp || {};
    const w = q.trim().toLowerCase();
    const open = !!w;
    const EASE = 'cubic-bezier(0.2, 0.8, 0.2, 1)';
    const P = [['ackstack', 'Ak', '#F3E7CC', '#8A6420', 1], ['meterwise', 'Mw', '#E6E9F2', '#3A4A75', 1], ['expirio', 'Ex', '#ECE6F3', '#5B3F86', 1], ['rangewise', 'Rw', '#E3EEE8', '#2F5E4C', 1], ['aitally', 'At', '#F0EEE6', '#2B2A27', 1], ['rateboard', 'Rb', '#DDEDEC', '#1F5357', 1], ['grantwell', 'Gw', '#E3EEE8', '#2F5E4C', 1], ['leakbook', 'Lb', '#E6E9F2', '#3A4A75', 1], ['arcdesk', 'Ad', '#ECEAE3', '#2B2A27', 1], ['beacon24', 'B2', '#ECE6F3', '#5B3F86', 0], ['chaseid', 'Ci', '#ECE6F3', '#5B3F86', 0]];
    const link = 'flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 10px; border-radius: 12px; color: #141413; text-decoration: none';
    const wrap = 'display: flex; align-items: center; gap: 2px';
    const prod = (p, child) => ({ href: p[4] ? 'Product.dc.html' : 'ProductIdea.dc.html', name: p[0], mono: p[1], kind: child ? 'Maker' : (p[4] ? 'Shipping' : 'Idea'), canExpand: false,
      wrap: wrap + (child ? '; margin-left: 24px; padding-left: 8px; border-left: 2px solid #ECEAE3' : ''), style: link,
      tile: 'width: ' + (child ? 26 : 30) + 'px; height: ' + (child ? 26 : 30) + 'px; border-radius: 9px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; background: ' + p[2] + '; color: ' + p[3] });
    const rows = [];
    if (w) {
      P.filter(p => p[0].includes(w)).slice(0, 3).forEach(p => rows.push(prod(p, false)));
      P.filter(p => ('maker of ' + p[0]).includes(w)).slice(0, 3).forEach(p => {
        const name = '[Maker of ' + p[0] + ']', isOpen = !!exp[name];
        rows.push({ href: 'Person.dc.html', name, mono: 'M', kind: 'Person', wrap, style: link, canExpand: true, open: isOpen,
          toggleLabel: (isOpen ? 'Hide products of ' : 'Show products of ') + name,
          chev: isOpen ? 'M6 15l6-6 6 6' : 'M6 9l6 6 6-6',
          toggle: () => this.setState({ qExp: { ...exp, [name]: !isOpen } }),
          tile: 'width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; background: #F0EEE6; color: #2B2A27' });
        if (isOpen) rows.push(prod(p, true));
      });
    }
    return { q, setQ: (e) => this.setState({ q: e.target.value }), qOpen: open, qRows: rows, qNone: open && rows.length === 0,
      qWrap: 'position: relative; display: flex; flex: 0 1 ' + (open ? '380px' : '260px') + '; transition: flex-basis 0.32s ' + EASE,
      qCard: 'position: absolute; top: -6px; left: -6px; right: -6px; z-index: 20; box-sizing: border-box; overflow: hidden; background: #FFFFFF; border-radius: 22px; box-shadow: inset 0 0 0 1px rgba(20,20,19,0.1); padding: 54px 6px 6px; display: flex; flex-direction: column; gap: 2px; transform-origin: top center; ' + (open ? 'max-height: 560px; opacity: 1; transform: scale(1); visibility: visible; transition: max-height 0.42s ' + EASE + ', opacity 0.2s ease, transform 0.32s ' + EASE : 'max-height: 52px; opacity: 0; transform: scale(0.98); visibility: hidden; pointer-events: none; transition: max-height 0.26s ' + EASE + ', opacity 0.18s ease, transform 0.26s ' + EASE + ', visibility 0s linear 0.26s'),
      qLabel: 'position: relative; z-index: 21; flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; border-radius: 999px; padding: 0 14px; min-height: 40px; transition: background 0.25s ease, box-shadow 0.25s ease; ' + (open ? 'background: #F7F5EF; box-shadow: none' : 'background: rgba(255,255,255,0.75); box-shadow: inset 0 0 0 1px rgba(20,20,19,0.07)') };
  }
  renderVals() { return { ...this.pageVals(), ...this.searchVals() }; }
  pageVals() {
    const ICON = {
      private: ['M6 11V8a6 6 0 0112 0v3M5 11h14v10H5z', '#5B6B8C', '#E6E9F2'],
      reply: ['M4 5h16v11H9l-5 4z', '#5B6B8C', '#E6E9F2'],
      react: ['M9 18h6M10 21h4M12 3a6 6 0 00-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0012 3z', '#B8862F', '#F3E7CC'],
      follow: ['M9 11a4 4 0 100-8 4 4 0 000 8zM2 21c1-4 4-6 7-6s6 2 7 6M17 11l2 2 4-4', '#2F7A4E', '#E3EEE8'],
      seat: ['M9 11a4 4 0 100-8 4 4 0 000 8zM2 21c1-4 4-6 7-6s6 2 7 6M19 8v6M16 11h6', '#2F6F73', '#DDEDEC'],
      demo: ['M8 5v14l11-7z', '#141413', '#ECEAE3'],
      version: ['M3 12V4h8l9 9-8 8zM7.5 7.5h.01', '#5B6B8C', '#E6E9F2']
    };
    const ROWS = [
      { id: 'a0', kind: 'private', group: 'today', tabs: ['mentions'], unread: true, who: '[Reader]', whoHref: 'Person.dc.html', text: 'started a private thread on', target: 'ackstack', targetHref: 'Product.dc.html', when: '[1h]' },
      { id: 'a1', kind: 'reply', group: 'today', tabs: ['mentions'], unread: true, who: '[Contributor]', whoHref: 'Person.dc.html', text: 'replied to your comment on', target: 'ackstack', targetHref: 'Feed.dc.html', quote: '[Their reply]', when: '[2h]' },
      { id: 'a2', kind: 'seat', group: 'today', tabs: ['seats'], unread: true, who: '[Applicant]', whoHref: 'Person.dc.html', text: 'requested a seat on ackstack:', target: 'HR-compliance advisor', targetHref: 'Product.dc.html', when: '[3h]', seat: true },
      { id: 'a3', kind: 'react', group: 'today', tabs: [], unread: true, who: '[Reader]', whoHref: 'Person.dc.html', text: 'reacted Useful to', target: 'The state re-collection calendar', targetHref: 'Feed.dc.html', when: '[5h]' },
      { id: 'a4', kind: 'follow', group: 'today', tabs: [], unread: false, who: '[Reader]', whoHref: 'Person.dc.html', text: 'followed', target: 'ackstack', targetHref: 'Product.dc.html', when: '[6h]' },
      { id: 'a5', kind: 'demo', group: 'earlier', tabs: [], unread: true, who: 'Orun', whoHref: 'DemoFlow.dc.html', text: 'finished recording your demo on', target: 'ackstack', targetHref: 'Product.dc.html', when: '[1d]', link: ['Review and approve', 'DemoFlow.dc.html'] },
      { id: 'a6', kind: 'version', group: 'earlier', tabs: [], unread: false, who: 'meterwise [v1.3.0]', whoHref: 'Product.dc.html', text: 'is now live on', target: 'stage', targetHref: 'Feed.dc.html', when: '[2d]' }
    ];
    const tab = this.state.tab;
    const isUnread = (r) => r.unread && !this.state.read[r.id];
    const anyUnread = ROWS.some(isUnread);
    const tabs = [['all', 'All'], ['mentions', 'Mentions'], ['seats', 'Seats']].map(([k, label]) => {
      const on = tab === k;
      return { label, on, pick: () => this.setState({ tab: k }),
        style: 'min-height: 40px; padding: 0 18px; border: 0; border-radius: 999px; font: inherit; font-size: 15px; cursor: pointer; ' + (on ? 'background: #141413; color: #FAF9F5; font-weight: 600' : 'background: transparent; color: #2B2A27; font-weight: 500') };
    });
    const seat = this.state.seat;
    const toRow = (r) => {
      const [d, c, tint] = ICON[r.kind];
      const un = isUnread(r);
      return {
        who: r.who, whoHref: r.whoHref, text: r.text, target: r.target, targetHref: r.targetHref, when: r.when, d, stroke: c,
        hasQuote: !!r.quote, quote: r.quote || '',
        hasLink: !!r.link, linkLabel: r.link ? r.link[0] : '', linkHref: r.link ? r.link[1] : '#',
        pending: !!r.seat && !seat, decided: !!r.seat && !!seat,
        decidedLabel: seat === 'accepted' ? 'Accepted' : 'Declined',
        decidedStyle: 'font-size: 13px; font-weight: 600; color: ' + (seat === 'accepted' ? '#2F7A4E' : '#6B6A66'),
        accept: () => this.setState({ seat: 'accepted', read: { ...this.state.read, [r.id]: true } }),
        decline: () => this.setState({ seat: 'declined', read: { ...this.state.read, [r.id]: true } }),
        dotLabel: un ? 'Unread' : '',
        dot: 'width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: ' + (un ? '#E3B34C' : 'transparent') + (un ? '; box-shadow: none' : ''),
        tile: 'width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: ' + tint,
        rowStyle: 'display: flex; flex-wrap: wrap; align-items: center; gap: 12px 14px; padding: 12px 14px; border-radius: 14px; ' + (un ? 'background: #FBF8F0' : 'background: transparent')
      };
    };
    const shown = ROWS.filter(r => tab === 'all' || r.tabs.indexOf(tab) >= 0);
    const groups = [['today', 'Today', 'TODAY'], ['earlier', 'Earlier', 'EARLIER']]
      .map(([k, label, mono]) => ({ label, mono, rows: shown.filter(r => r.group === k).map(toRow) }))
      .filter(g => g.rows.length > 0);
    return {
      tabs, groups, empty: groups.length === 0, anyUnread, noUnread: !anyUnread,
      markAll: () => { const read = { ...this.state.read }; ROWS.forEach(r => { read[r.id] = true; }); this.setState({ read }); },
      markStyle: 'min-height: 40px; padding: 0 18px; border: 0; border-radius: 999px; font: inherit; font-size: 13px; font-weight: 600; ' + (anyUnread ? 'background: rgba(20,20,19,0.06); color: #141413; cursor: pointer' : 'background: rgba(20,20,19,0.03); color: #A8A59C; cursor: default')
    };
  }
}
</script>
</body>
</html>
