<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Products directory, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&amp;family=Lora:wght@400;500&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
:root{color-scheme:light}body{margin:0}
a{color:#8A6420}a:hover{color:#5E4415}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background-color: #F6F4EE; background-image: radial-gradient(500px 260px at 50% -6%, rgba(184,134,47,0.2), transparent 65%), radial-gradient(rgba(20,20,19,0.07) 1px, transparent 1.2px); background-size: auto, 20px 20px; color: #141413; font-family: 'Hanken Grotesk', system-ui, sans-serif; font-size: 15px; line-height: 1.5; display: flex; flex-direction: column; overflow: hidden">

<header style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: rgba(255,255,255,0.6); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px)">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3.5V21" stroke="#141413"></path><circle cx="14" cy="9.5" r="6" stroke="#B8862F"></circle></svg>
<label style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; background: #FFFFFF; border-radius: 999px; box-shadow: inset 0 0 0 1px rgba(20,20,19,0.07); padding: 0 12px; min-height: 44px; box-sizing: border-box">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6B6A66" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<span style="position: absolute; left: -9999px">Search products</span>
<input type="search" value="{{query}}" onInput="{{setQuery}}" placeholder="Search products" style="border: 0; outline: 0; background: transparent; color: #141413; font: inherit; font-size: 16px; flex: 1; min-width: 0">
</label>
<a href="PhoneMe.dc.html" aria-label="Your profile" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #6B6A66; flex-shrink: 0"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg></a>
</header>

<div style="flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; box-sizing: border-box; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 10px">

<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 2px">
<h1 style="margin: 0; font-family: Lora, Georgia, serif; font-weight: 400; font-size: 28px; line-height: 1.1; letter-spacing: -0.015em">Products</h1>
<button type="button" onClick="{{toggleSort}}" aria-expanded="{{sortOpen}}" aria-label="{{sortAria}}" style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border: 0; border-radius: 999px; background: rgba(20,20,19,0.06); color: #141413; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M7 12h10M10 17h4"></path></svg>{{sortLabel}}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="{{sortChev}}"></path></svg></button>
</div>

<sc-if value="{{sortOpen}}" hint-placeholder-val="{{false}}">
<div role="group" aria-label="Sort" style="display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: rgba(20,20,19,0.06); flex-shrink: 0">
<sc-for list="{{sorts}}" as="s" hint-placeholder-count="3">
<button type="button" onClick="{{s.pick}}" aria-pressed="{{s.on}}" style="{{s.style}}">{{s.label}}</button>
</sc-for>
</div>
</sc-if>

<div role="group" aria-label="Stage" style="display: flex; gap: 6px; flex-shrink: 0">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
<button type="button" onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="{{f.style}}"><span aria-hidden="true" style="{{f.dot}}"></span>{{f.label}}<span style="{{f.countStyle}}">{{f.count}}</span></button>
</sc-for>
</div>

<sc-for list="{{cards}}" as="p" hint-placeholder-count="4">
<article style="{{p.cardStyle}}">
<a href="{{p.href}}" style="display: flex; flex-direction: column; gap: 8px; padding: 14px 14px 4px; color: #141413; text-decoration: none">
<div style="display: flex; align-items: center; gap: 12px">
<span style="{{p.tile}}">{{p.mono}}</span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<span style="font-weight: 600; font-size: 18px; letter-spacing: -0.015em; line-height: 1.2">{{p.name}}</span>
<span style="font-size: 13px; color: #6B6A66">{{p.category}}</span>
</div>
<sc-if value="{{p.shipping}}" hint-placeholder-val="{{true}}">
<span style="display: flex; align-items: center; gap: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.12em; color: #8A6420; white-space: nowrap"><span style="width: 7px; height: 7px; border-radius: 50%; background: #B8862F"></span>SHIPPING · 3 OF 4</span>
</sc-if>
<sc-if value="{{p.idea}}" hint-placeholder-val="{{false}}">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.12em; color: #5B3F86; white-space: nowrap">IDEA</span>
</sc-if>
</div>
<sc-if value="{{p.shipping}}" hint-placeholder-val="{{true}}">
<div style="display: flex; gap: 3px" aria-hidden="true"><div style="flex: 1; height: 4px; border-radius: 2px; background: linear-gradient(90deg, #B8862F, #E3B34C)"></div><div style="flex: 1; height: 4px; border-radius: 2px; background: linear-gradient(90deg, #B8862F, #E3B34C)"></div><div style="flex: 1; height: 4px; border-radius: 2px; background: linear-gradient(90deg, #B8862F, #E3B34C)"></div><div style="flex: 1; height: 4px; border-radius: 2px; background: #EDE9DE"></div></div>
</sc-if>
<sc-if value="{{p.idea}}" hint-placeholder-val="{{false}}">
<span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #5B3F86"><span style="width: 12px; height: 12px; border-radius: 50%; border: 1.5px dashed #5B3F86; box-sizing: border-box"></span>Needs a first builder</span>
</sc-if>
<p style="margin: 0; color: #2B2A27; font-size: 15px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{p.desc}}</p>
</a>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 14px 12px">
<a href="PhoneSeats.dc.html" style="display: flex; align-items: center; gap: 6px; min-height: 44px; font-size: 13px; color: #1F5357; text-decoration: none; font-weight: 600"><span style="width: 14px; height: 14px; border-radius: 50%; border: 1.5px dashed #2F6F73; box-sizing: border-box"></span>{{p.seats}}</a>
<button type="button" onClick="{{p.toggle}}" aria-pressed="{{p.following}}" aria-label="{{p.followAria}}" style="{{p.followStyle}}">{{p.followLabel}}</button>
</div>
</article>
</sc-for>

<sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
<div style="padding: 28px 16px; border-radius: 16px; background: #FFFFFF; text-align: center; color: #6B6A66">No products match “{{query}}”.</div>
</sc-if>

<sc-if value="{{showFooter}}" hint-placeholder-val="{{true}}">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; padding: 0 2px; flex-shrink: 0">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.12em; color: #6B6A66">{{shownLabel}}</span>
<sc-if value="{{hasMore}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{more}}" style="min-height: 44px; padding: 0 20px; border: 0; border-radius: 999px; background: rgba(20,20,19,0.06); color: #141413; font: inherit; font-weight: 600; cursor: pointer">Show more</button>
</sc-if>
</div>
</sc-if>

</div>

<nav aria-label="Main" style="position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 10px 10px 14px; padding: 4px 6px; background: #FFFFFF; border-radius: 16px">
<a href="PhoneFeed.dc.html" style="min-height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #6B6A66; text-decoration: none; font-size: 11px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"></path></svg>Feed</a>
<a href="PhoneProducts.dc.html" aria-current="page" style="min-height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #141413; text-decoration: none; font-size: 11px; font-weight: 600">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"></rect><rect x="14" y="3" width="7" height="7" rx="2"></rect><rect x="3" y="14" width="7" height="7" rx="2"></rect><rect x="14" y="14" width="7" height="7" rx="2"></rect></svg>Products</a>
<a href="PhoneSeats.dc.html" style="min-height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #6B6A66; text-decoration: none; font-size: 11px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M3 20c.8-3.5 3.2-5.5 6-5.5s5.2 2 6 5.5"></path><path d="M18 8v6M15 11h6"></path></svg>Seats</a>
<a href="PhoneActivity.dc.html" style="min-height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #6B6A66; text-decoration: none; font-size: 11px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 8a6 6 0 0112 0c0 7 3 8 3 8H3s3-1 3-8"></path><path d="M10 20a2 2 0 004 0"></path></svg>Activity</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { filter: 'all', query: '', sort: 'recent', sortOpen: false, shown: 8, follow: {} }; }
  renderVals() {
    const S = (name, category, desc, mono, bg, fg) => ({ name, category, desc, mono, bg, fg, stage: 'shipping' });
    const I = (name, category, desc) => ({ name, category, desc, mono: name.slice(0, 1).toUpperCase() + name.slice(1, 2), bg: '#ECE6F3', fg: '#5B3F86', stage: 'idea' });
    const ALL = [
      S('ackstack', 'Productivity', 'Send policies, collect e-acknowledgments and re-collect them on each state’s schedule.', 'Ak', '#F3E7CC', '#8A6420'),
      S('meterwise', 'Infrastructure', 'Per-customer LLM cost attribution and margin guardrails for AI SaaS.', 'Mw', '#E6E9F2', '#3A4A75'),
      S('expirio', 'Productivity', 'Never let a license, permit, insurance policy or certification lapse again.', 'Ex', '#ECE6F3', '#5B3F86'),
      S('rangewise', 'Other', 'Check job ads for missing or non-compliant salary ranges before they go live.', 'Rw', '#E3EEE8', '#2F5E4C'),
      S('aitally', 'Education', 'An AI tool register, staff AI training records and regulator-ready evidence.', 'At', '#F3E7CC', '#8A6420'),
      S('rateboard', 'Media', 'Sponsor pipeline and anonymized rate benchmarks for podcasters and newsletter writers.', 'Rb', '#DDEDEC', '#1F5357'),
      S('grantwell', 'Productivity', 'Grant deadlines, deliverables and reports for nonprofits without a development team.', 'Gw', '#E3EEE8', '#2F5E4C'),
      S('leakbook', 'Other', 'A phone-first refrigerant log with automatic leak-rate maths and 30-day repair clocks.', 'Lb', '#E6E9F2', '#3A4A75'),
      S('arcdesk', 'Other', 'An online form, review board and decision-deadline clock for HOA architectural requests.', 'Ad', '#ECEAE3', '#2B2A27'),
      I('chaseid', 'Productivity', 'Companies House ID verification chasing.'),
      I('beacon24', 'Security', 'EU Cyber Resilience Act reporting.'),
      I('stepthrough', 'Dev tools', 'Debug CI locally with breakpoints.'),
      I('flakeless', 'Dev tools', 'Quarantine flaky tests.'),
      I('pipebill', 'Dev tools', 'GitHub Actions cost per repo.'),
      I('sunsetd', 'Infrastructure', 'End-of-life tracking with upgrade PRs.'),
      I('seatsweep', 'Security', 'Revoke ex-employee SaaS access.'),
      I('rightkeep', 'Media', 'A licence vault for stock assets.'),
      I('lapsely', 'Data', 'Unclaimed-property deadlines.'),
      I('tenready', 'Communication', 'A2P 10DLC pre-check.'),
      I('renewcue', 'Commerce', 'Stripe auto-renewal notices.'),
      I('marginmap', 'Data', 'MSP margin per client.'),
      I('dwelltime', 'Productivity', 'Detention-pay invoices from ELD data.'),
      I('waiverly', 'Productivity', 'Lien waivers.'),
      I('certcrate', 'Productivity', 'Subcontractor COIs and W-9s.'),
      I('unitlog', 'Productivity', 'One phone number per rental unit.'),
      I('voxquote', 'Productivity', 'Voice note to quote.'),
      I('stockstitch', 'Commerce', 'Inventory sync across Etsy, Shopify and a market stall.'),
      I('paidstone', 'Commerce', 'Milestone deposits for freelancers.'),
      I('holdfast', 'Commerce', 'Deposit links for DMs.'),
      I('docketdrop', 'Productivity', 'Client tax documents by SMS.')
    ].map((p, i) => ({ ...p, order: i, seatsN: 2 }));
    const STEP = 8;
    const st = this.state;

    const DOT = { all: '', shipping: '#B8862F', idea: '#5B3F86' };
    const LABEL = { all: 'Everything', shipping: 'Shipping', idea: 'Ideas' };
    const filters = ['all', 'shipping', 'idea'].map(k => {
      const on = st.filter === k;
      const n = k === 'all' ? ALL.length : ALL.filter(p => p.stage === k).length;
      return { label: LABEL[k], on, count: String(n),
        pick: () => this.setState({ filter: k, shown: STEP }),
        dot: DOT[k] ? 'width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; background: ' + (on && k === 'idea' ? '#C9B6E0' : on ? '#E3B34C' : DOT[k]) : 'display: none',
        countStyle: 'font-family: IBM Plex Mono, monospace; font-size: 11px; color: ' + (on ? '#D9D6CC' : '#6B6A66'),
        style: 'flex: 1 1 auto; display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 12px; border: 0; border-radius: 999px; font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; ' + (on ? 'background: #141413; color: #FAF9F5; font-weight: 600' : 'background: #FFFFFF; color: #2B2A27; font-weight: 500')
      };
    });

    const SORTS = [['recent', 'Recently shipped'], ['seats', 'Most open seats'], ['az', 'A–Z']];
    const sorts = SORTS.map(([k, label]) => {
      const on = st.sort === k;
      return { label, on, pick: () => this.setState({ sort: k, sortOpen: false, shown: STEP }),
        style: 'flex: 1 1 auto; min-height: 44px; padding: 0 12px; border: 0; border-radius: 999px; font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; ' + (on ? 'background: #FFFFFF; color: #141413; font-weight: 600' : 'background: transparent; color: #2B2A27; font-weight: 500') };
    });
    const sortLabel = SORTS.find(s => s[0] === st.sort)[1];

    const q = (st.query || '').trim().toLowerCase();
    let list = ALL.filter(p => (st.filter === 'all' || p.stage === st.filter) && (!q || p.name.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q)));
    const byName = (a, b) => a.name.localeCompare(b.name);
    if (st.sort === 'az') list = list.slice().sort(byName);
    else if (st.sort === 'seats') list = list.slice().sort((a, b) => (b.seatsN - a.seatsN) || byName(a, b));
    else list = list.slice().sort((a, b) => a.order - b.order);

    const shown = Math.min(st.shown, list.length);
    const cards = list.slice(0, shown).map(p => {
      const on = !!st.follow[p.name];
      const idea = p.stage === 'idea';
      return { href: p.stage === 'idea' ? 'PhoneProductIdea.dc.html' : 'PhoneProduct.dc.html', name: p.name, category: p.category, desc: p.desc, mono: p.mono,
        shipping: !idea, idea,
        seats: p.seatsN + ' open seats',
        cardStyle: 'flex-shrink: 0; display: flex; flex-direction: column; overflow: hidden; ' + (idea ? 'background: #F4F0F8; border-radius: 4px 16px 16px 16px' : 'background: #FFFFFF; border-radius: 16px'),
        tile: 'width: 46px; height: 46px; border-radius: 14px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 15px; letter-spacing: -0.02em; ' + (idea ? 'background: #FFFFFF; color: #5B3F86; box-shadow: inset 0 0 0 1.5px rgba(91,63,134,0.3)' : 'background: ' + p.bg + '; color: ' + p.fg),
        following: on, followLabel: on ? 'Following' : 'Follow', followAria: (on ? 'Unfollow ' : 'Follow ') + p.name,
        toggle: () => this.setState({ follow: { ...st.follow, [p.name]: !on } }),
        followStyle: 'min-height: 44px; padding: 0 18px; border: 0; border-radius: 999px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; ' + (on ? 'background: rgba(20,20,19,0.06); color: #2B2A27' : 'background: #FFFFFF; color: #141413; box-shadow: inset 0 0 0 1.5px #141413')
      };
    });

    return {
      filters, sorts, cards,
      query: st.query,
      setQuery: (e) => this.setState({ query: e && e.target ? e.target.value : String(e || ''), shown: STEP }),
      sortOpen: st.sortOpen, sortLabel, sortAria: 'Sort: ' + sortLabel,
      sortChev: st.sortOpen ? 'M6 15l6-6 6 6' : 'M6 9l6 6 6-6',
      toggleSort: () => this.setState({ sortOpen: !st.sortOpen }),
      empty: list.length === 0,
      showFooter: list.length > 0,
      shownLabel: shown + ' OF ' + list.length + ' SHOWN',
      hasMore: shown < list.length,
      more: () => this.setState({ shown: st.shown + STEP })
    };
  }
}
</script>
</body>
</html>
