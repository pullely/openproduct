<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&amp;family=Lora:ital,wght@0,400;1,400&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
:root{color-scheme:light}body{margin:0;background:#F6F4EE}
a{color:#8A6420}a:hover{color:#5E4415}
input::placeholder{color:#A8A59C}
@media (max-width: 820px){.op-visual{display:none !important}}
</style>
</helmet>
<div style="background-color: #F6F4EE; background-image: radial-gradient(1100px 460px at 50% -8%, rgba(184,134,47,0.18), transparent 62%), radial-gradient(rgba(20,20,19,0.07) 1px, transparent 1.2px); background-size: auto, 22px 22px; color: #141413; font-family: 'Hanken Grotesk', system-ui, sans-serif; font-size: 15px; line-height: 1.5; min-height: 100%; display: flex; flex-direction: column">

<div style="width: 100%; max-width: 1180px; margin: 0 auto; box-sizing: border-box; padding: 18px 24px; display: flex; align-items: center">
<a href="Feed.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 40px; color: #141413; text-decoration: none; font-weight: 600; font-size: 18px; letter-spacing: -0.02em">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3.5V21" stroke="#141413"></path><circle cx="14" cy="9.5" r="6" stroke="#B8862F"></circle></svg>openproduct</a>
</div>

<main style="flex: 1 1 auto; width: 100%; max-width: 1180px; margin: 0 auto; box-sizing: border-box; padding: 24px 24px 72px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 56px 72px">

<div class="op-visual" aria-hidden="true" style="flex: 0 1 360px; min-width: 0; height: 400px; position: relative">
<div style="position: absolute; left: 34px; right: 0; top: 18px; height: 150px; border-radius: 4px 16px 16px 16px; background: #F4F0F8; box-shadow: none; transform: rotate(4deg); opacity: 0.75; padding: 22px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
<span style="height: 8px; width: 38%; border-radius: 4px; background: rgba(91,63,134,0.28)"></span>
<span style="height: 14px; width: 82%; border-radius: 6px; background: rgba(91,63,134,0.18)"></span>
<span style="height: 14px; width: 64%; border-radius: 6px; background: rgba(91,63,134,0.18)"></span>
<span style="margin-top: 6px; height: 30px; border-radius: 12px; border: 1.5px dashed rgba(91,63,134,0.35)"></span>
</div>
<div style="position: absolute; left: 14px; right: 18px; top: 112px; height: 150px; border-radius: 16px; background: #FFFFFF; box-shadow: none; transform: rotate(-3deg); opacity: 0.9; padding: 18px; box-sizing: border-box">
<div style="height: 100%; border-radius: 12px; background: #F4F6FA; padding: 14px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
<span style="height: 7px; width: 30%; border-radius: 4px; background: rgba(91,107,140,0.35)"></span>
<span style="height: 18px; width: 40%; border-radius: 5px; background: rgba(31,42,68,0.55)"></span>
<span style="height: 8px; width: 88%; border-radius: 4px; background: rgba(58,74,117,0.16)"></span>
<span style="height: 8px; width: 72%; border-radius: 4px; background: rgba(58,74,117,0.16)"></span>
</div>
</div>
<div style="position: absolute; left: 0; right: 30px; top: 214px; border-radius: 16px; background: radial-gradient(320px 140px at 100% 0%, rgba(227,179,76,0.24), transparent 70%), #FFFFFF; box-shadow: none; padding: 18px 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 10px">
<span style="width: 34px; height: 34px; border-radius: 11px; background: #F3E7CC; color: #8A6420; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px">Ak</span>
<span style="height: 9px; width: 34%; border-radius: 4px; background: #E4E2DA"></span>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<span style="width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #E3B34C, #B8862F); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6"><path d="M5 12l5 5 9-10"></path></svg></span>
<span style="height: 14px; width: 66%; border-radius: 6px; background: #2B2A27; opacity: 0.85"></span>
</div>
<div style="display: flex; gap: 4px"><span style="flex: 1; height: 5px; border-radius: 3px; background: linear-gradient(90deg, #B8862F, #E3B34C)"></span><span style="flex: 1; height: 5px; border-radius: 3px; background: linear-gradient(90deg, #B8862F, #E3B34C)"></span><span style="flex: 1; height: 5px; border-radius: 3px; background: linear-gradient(90deg, #B8862F, #E3B34C)"></span><span style="flex: 1; height: 5px; border-radius: 3px; background: #EDE9DE"></span></div>
</div>
</div>

<section aria-label="Sign in" style="flex: 0 1 420px; min-width: 0; box-sizing: border-box; background: radial-gradient(420px 200px at 100% 0%, rgba(227,179,76,0.2), transparent 70%), rgba(255,255,255,0.72); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-radius: 16px; box-shadow: none; padding: 36px 32px 30px; display: flex; flex-direction: column; gap: 18px">

<sc-if value="{{isStart}}" hint-placeholder-val="{{true}}">
<h1 style="margin: 0; font-family: Lora, Georgia, serif; font-weight: 400; font-size: 40px; line-height: 1.1; letter-spacing: -0.015em">Sign in</h1>
<a href="#" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 40px; border-radius: 999px; background: #141413; color: #FAF9F5; text-decoration: none; font-weight: 600; font-size: 15px; box-shadow: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E3B34C" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"></path><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"></path></svg>Continue with Orunbase</a>
<div style="display: flex; align-items: center; gap: 12px" aria-hidden="true">
<span style="flex: 1; height: 1px; background: rgba(20,20,19,0.1)"></span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.12em; color: #8A877F">OR</span>
<span style="flex: 1; height: 1px; background: rgba(20,20,19,0.1)"></span>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<label style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 18px; border-radius: 999px; background: #FFFFFF; box-shadow: inset 0 0 0 1px rgba(20,20,19,0.09)">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6B6A66" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>
<span style="position: absolute; left: -9999px">Email address</span>
<input type="email" autocomplete="email" value="{{email}}" onInput="{{setEmail}}" onKeyDown="{{onKey}}" placeholder="you@example.com" style="border: 0; outline: 0; background: transparent; color: #141413; font: inherit; font-size: 16px; flex: 1; min-width: 0">
</label>
<button type="button" onClick="{{send}}" disabled="{{notValid}}" style="{{sendStyle}}">Email me a sign-in link</button>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; padding-top: 4px; font-size: 13px; color: #6B6A66">
<span>Same Orunbase account, not a second one.</span>
<span>New here? <a href="#" style="font-weight: 600; text-decoration: none">Create an account</a></span>
</div>
</sc-if>

<sc-if value="{{isSent}}" hint-placeholder-val="{{false}}">
<div style="width: 64px; height: 64px; border-radius: 50%; background: #F3E7CC; box-shadow: none; display: flex; align-items: center; justify-content: center; color: #8A6420"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg></div>
<h1 style="margin: 0; font-family: Lora, Georgia, serif; font-weight: 400; font-size: 40px; line-height: 1.1; letter-spacing: -0.015em">Check your inbox</h1>
<div role="status" style="display: flex; flex-direction: column; gap: 2px; font-size: 15px; color: #2B2A27">
<span>We sent a sign-in link to</span>
<span style="font-weight: 600; color: #141413; word-break: break-all">{{email}}</span>
</div>
<button type="button" onClick="{{back}}" style="align-self: flex-start; display: flex; align-items: center; gap: 6px; min-height: 40px; padding: 0; border: 0; background: transparent; font: inherit; font-size: 15px; font-weight: 600; color: #8A6420; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>Use a different email</button>
</sc-if>

</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mode: 'start', email: '' }; }
  renderVals() {
    const email = this.state.email;
    const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim());
    const send = () => { if (valid) this.setState({ mode: 'sent', email: email.trim() }); };
    return {
      isStart: this.state.mode === 'start',
      isSent: this.state.mode === 'sent',
      email,
      notValid: !valid,
      setEmail: (e) => this.setState({ email: e.target.value }),
      onKey: (e) => { if (e.key === 'Enter') { e.preventDefault(); send(); } },
      send,
      back: () => this.setState({ mode: 'start' }),
      sendStyle: 'min-height: 40px; padding: 0 20px; border: 0; border-radius: 999px; font: inherit; font-size: 15px; font-weight: 600; transition: background 0.2s ease, color 0.2s ease; ' + (valid ? 'background: #F3E7CC; color: #5E4415; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(184,134,47,0.35)' : 'background: rgba(20,20,19,0.05); color: #A8A59C; cursor: default')
    };
  }
}
</script>
</body>
</html>
