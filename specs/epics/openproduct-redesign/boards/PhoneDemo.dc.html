<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Record a demo, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&amp;family=Lora:wght@400;500&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
:root{color-scheme:light}body{margin:0}
a{color:#8A6420}a:hover{color:#5E4415}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background-color: #F6F4EE; background-image: radial-gradient(500px 260px at 50% -6%, rgba(184,134,47,0.2), transparent 65%), radial-gradient(rgba(20,20,19,0.07) 1px, transparent 1.2px); background-size: auto, 20px 20px; color: #141413; font-family: 'Hanken Grotesk', system-ui, sans-serif; font-size: 15px; line-height: 1.5; display: flex; flex-direction: column; overflow: hidden">

<header style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: rgba(255,255,255,0.6); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px)">
<a href="PhoneProduct.dc.html" aria-label="Back to ackstack" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; color: #141413; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25"><span style="font-size: 13px; color: #6B6A66">ackstack</span><span style="font-weight: 600; font-size: 18px; letter-spacing: -0.02em">Record a demo</span></span>
<sc-if value="{{onPick}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{startRec}}" disabled="{{noneSelected}}" style="{{recBtnStyle}}">{{recBtnLabel}}</button>
</sc-if>
<sc-if value="{{onReview}}" hint-placeholder-val="{{false}}">
<a href="PhoneFeed.dc.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 999px; background: #141413; color: #FAF9F5; text-decoration: none; font-weight: 600; flex-shrink: 0">Post</a>
</sc-if>
</header>

<div style="flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 10px 12px 12px">

<ol aria-label="Stages" style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{stages}}" as="s" hint-placeholder-count="3">
<li aria-current="{{s.current}}" style="{{s.style}}">
<span style="{{s.numStyle}}"><sc-if value="{{s.done}}" hint-placeholder-val="{{false}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></sc-if><sc-if value="{{s.open}}" hint-placeholder-val="{{true}}">{{s.n}}</sc-if></span>
<span style="font-size: 11px; font-weight: 600; line-height: 1.15">{{s.label}}</span>
</li>
</sc-for>
</ol>

<sc-if value="{{onPick}}" hint-placeholder-val="{{true}}">
<section aria-label="Pick flows" style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 4px 4px 0; font-size: 18px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.2">Which flows should Orun record?</h2>
<sc-for list="{{flows}}" as="f" hint-placeholder-count="4">
<div style="{{f.style}}">
<label style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; min-height: 44px; cursor: pointer">
<input type="checkbox" checked="{{f.on}}" onChange="{{f.toggle}}" style="width: 20px; height: 20px; margin: 0; accent-color: #141413; flex-shrink: 0">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-weight: 600; line-height: 1.3">{{f.title}}</span>
<span style="font-size: 13px; color: #6B6A66">{{f.meta}}</span>
</span>
</label>
<a href="#" aria-label="{{f.scriptLabel}}" style="display: flex; align-items: center; min-height: 44px; font-size: 13px; font-weight: 600; text-decoration: none; flex-shrink: 0">Script</a>
</div>
</sc-for>
<div style="background: #FFFFFF; border-radius: 16px; padding: 2px 14px; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #6B6A66; letter-spacing: 0.12em">RUNS AGAINST</span><span style="font-weight: 600">Stage</span></div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; border-top: 1px solid rgba(20,20,19,0.06)"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #6B6A66; letter-spacing: 0.12em">DATA</span><span style="font-weight: 600">Seed data only</span></div>
</div>
</section>
</sc-if>

<sc-if value="{{onRec}}" hint-placeholder-val="{{false}}">
<section aria-label="Orun records" style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 4px 4px 0; font-size: 18px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.2">Recording: collect an acknowledgment</h2>
<div style="background: #FFFFFF; border-radius: 16px; padding: 6px 14px 14px; display: flex; flex-direction: column">
<sc-for list="{{recSteps}}" as="r" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 10px; min-height: 52px">
<span style="{{r.iconStyle}}"><sc-if value="{{r.done}}" hint-placeholder-val="{{false}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></sc-if><sc-if value="{{r.open}}" hint-placeholder-val="{{true}}">{{r.n}}</sc-if></span>
<span style="{{r.textStyle}}">{{r.label}}</span>
<span style="{{r.stateStyle}}">{{r.state}}</span>
</div>
</sc-for>
<div role="img" aria-label="{{recBarLabel}}" style="margin-top: 8px; height: 6px; border-radius: 3px; background: rgba(20,20,19,0.08); overflow: hidden"><div style="{{recBar}}"></div></div>
</div>
</section>
</sc-if>

<sc-if value="{{onReview}}" hint-placeholder-val="{{false}}">
<section aria-label="Review and post" style="display: flex; flex-direction: column; gap: 10px">
<div style="background: #141413; border-radius: 16px; padding: 8px">
<div style="height: 190px; border-radius: 12px; background: #FAF9F5; position: relative; overflow: hidden" aria-hidden="true">
<div style="position: absolute; left: 0; top: 0; bottom: 0; width: 70px; background: #F0EEE6"></div>
<div style="position: absolute; left: 84px; right: 14px; top: 14px; height: 76px; border-radius: 12px; background: #F0EEE6"></div>
<div style="position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: rgba(20,20,19,0.88); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="#FAF9F5" stroke="none" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg></div>
</div>
</div>
<div style="background: #FFFFFF; border-radius: 16px; padding: 2px 14px; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #6B6A66; letter-spacing: 0.12em">STEPS</span><span style="font-weight: 600; color: #2F7A4E">5 of 5 passed</span></div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; border-top: 1px solid rgba(20,20,19,0.06)"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #6B6A66; letter-spacing: 0.12em">VISIBLE TO</span><span style="display: flex; align-items: center; gap: 6px; font-weight: 600"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 11V8a6 6 0 0112 0v3M5 11h14v10H5z"></path></svg>Only you, until you post</span></div>
</div>
<div style="background: #FFFFFF; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px">
<label for="d-title" style="font-size: 13px; font-weight: 600">Title</label>
<textarea id="d-title" rows="2" value="{{title}}" onInput="{{setTitle}}" style="box-sizing: border-box; width: 100%; padding: 10px 14px; border: 0; outline: 0; border-radius: 14px; background: #F7F5EF; color: #141413; font: inherit; font-size: 16px; resize: none"></textarea>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<label for="d-note" style="font-size: 13px; font-weight: 600">Say something about it <span style="font-weight: 400; color: #6B6A66">optional</span></label>
<textarea id="d-note" rows="3" value="{{note}}" onInput="{{setNote}}" style="box-sizing: border-box; width: 100%; padding: 10px 14px; border: 0; outline: 0; border-radius: 14px; background: #F7F5EF; color: #141413; font: inherit; font-size: 16px; resize: none"></textarea>
</div>
</div>
</section>
</sc-if>
</div>

<sc-if value="{{onReview}}" hint-placeholder-val="{{false}}">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 10px 14px; padding: 8px; background: #FFFFFF; border-radius: 16px">
<button type="button" onClick="{{restart}}" style="min-height: 44px; padding: 0 16px; border: 0; border-radius: 999px; background: transparent; color: #6B6A66; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Discard</button>
<button type="button" onClick="{{saveDraft}}" style="min-height: 44px; padding: 0 16px; border: 0; border-radius: 999px; background: rgba(20,20,19,0.06); color: #141413; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">{{draftLabel}}</button>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { stage: 1, sel: { a: true }, rec: 0, title: 'Watch ackstack collect an acknowledgment, start to finish', note: '', saved: false };
  }
  componentDidMount() {
    this.timer = setInterval(() => {
      if (this.state.stage !== 2) return;
      if (this.state.rec >= 5) this.setState({ stage: 3 });
      else this.setState({ rec: this.state.rec + 1 });
    }, 900);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const S = this.state;
    const st = S.stage;
    const stages = ['Pick flows', 'Orun records', 'Review and post'].map((label, i) => {
      const n = i + 1, now = n === st, done = n < st;
      return {
        label, n: String(n), done, open: !done, current: now ? 'step' : 'false',
        style: 'display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 60px; padding: 6px 2px; border-radius: 14px; text-align: center; ' + (now ? 'background: #FFFFFF; color: #141413' : 'background: transparent; color: ' + (done ? '#2B2A27' : '#6B6A66')),
        numStyle: 'width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0; ' + (now || done ? 'background: #141413; color: #FAF9F5' : 'background: #F0EEE6; color: #6B6A66')
      };
    });
    const FLOWS = [
      { id: 'a', title: 'Collect an acknowledgment, start to finish', meta: '5 steps · from AS1, AS2 and AS3' },
      { id: 'b', title: 'Supersede a policy with a new version', meta: '4 steps · from AS3' },
      { id: 'c', title: 'Export a per-employee CSV', meta: '3 steps · from AS3' },
      { id: 'd', title: 'Assign a policy by role across two states', meta: '4 steps · from AS2' }
    ];
    const flows = FLOWS.map(f => {
      const on = !!S.sel[f.id];
      return {
        ...f, on, scriptLabel: 'View script: ' + f.title,
        toggle: () => this.setState({ sel: { ...this.state.sel, [f.id]: !on } }),
        style: 'display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 16px; background: #FFFFFF; box-shadow: ' + (on ? 'inset 0 0 0 2px #141413' : 'none')
      };
    });
    const count = FLOWS.filter(f => S.sel[f.id]).length;
    const STEPS = ['Upload a policy PDF', 'Assign it to New York staff', 'Open the no-login acknowledgment link', 'Acknowledge: time, IP and version are recorded', 'See the next New York re-collection date'];
    const rec = S.rec;
    const recSteps = STEPS.map((label, i) => {
      const done = i < rec, now = i === rec;
      return {
        label, n: String(i + 1), done, open: !done,
        state: done ? 'passed' : now ? 'running' : 'waiting',
        stateStyle: 'font-family: IBM Plex Mono, monospace; font-size: 11px; flex-shrink: 0; color: ' + (done ? '#2F7A4E' : now ? '#8A6420' : '#6B6A66'),
        iconStyle: 'width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; ' + (done ? 'background: #2F7A4E; color: #FFFFFF' : now ? 'background: #F3E7CC; color: #8A6420; box-shadow: inset 0 0 0 1.5px #B8862F' : 'background: #F0EEE6; color: #6B6A66'),
        textStyle: 'flex: 1; min-width: 0; line-height: 1.3; ' + (done || now ? 'color: #141413' : 'color: #6B6A66') + (now ? '; font-weight: 600' : '')
      };
    });
    return {
      stages, flows,
      onPick: st === 1, onRec: st === 2, onReview: st === 3,
      noneSelected: count === 0,
      recBtnLabel: count === 0 ? 'Pick a flow' : 'Record ' + count + (count === 1 ? ' demo' : ' demos'),
      recBtnStyle: 'min-height: 44px; padding: 0 18px; border: 0; border-radius: 999px; font: inherit; font-weight: 600; flex-shrink: 0; ' + (count === 0 ? 'background: #E4E2DA; color: #6B6A66; cursor: default' : 'background: #141413; color: #FAF9F5; cursor: pointer'),
      startRec: () => { if (count) this.setState({ stage: 2, rec: 0 }); },
      recSteps,
      recBarLabel: Math.min(rec, 5) + ' of 5 steps passed',
      recBar: 'height: 6px; background: linear-gradient(90deg, #B8862F, #E3B34C); transition: width 0.4s; width: ' + Math.round((Math.min(rec, 5) / 5) * 100) + '%',
      title: S.title, setTitle: (e) => this.setState({ title: e.target.value, saved: false }),
      note: S.note, setNote: (e) => this.setState({ note: e.target.value, saved: false }),
      draftLabel: S.saved ? 'Draft saved' : 'Save draft',
      saveDraft: () => this.setState({ saved: true }),
      restart: () => this.setState({ stage: 1, rec: 0, saved: false })
    };
  }
}
</script>
</body>
</html>
