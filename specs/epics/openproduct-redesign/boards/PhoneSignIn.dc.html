<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&amp;family=Lora:wght@400;500&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
:root{color-scheme:light}body{margin:0}
a{color:#8A6420}a:hover{color:#5E4415}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background-color: #F6F4EE; background-image: radial-gradient(500px 260px at 50% -6%, rgba(184,134,47,0.2), transparent 65%), radial-gradient(rgba(20,20,19,0.07) 1px, transparent 1.2px); background-size: auto, 20px 20px; color: #141413; font-family: 'Hanken Grotesk', system-ui, sans-serif; font-size: 15px; line-height: 1.5; display: flex; flex-direction: column; overflow: hidden">

<div style="display: flex; align-items: center; padding: 12px 14px">
<a href="PhoneFeed.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; color: #141413; text-decoration: none; font-weight: 600; font-size: 18px; letter-spacing: -0.02em">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3.5V21" stroke="#141413"></path><circle cx="14" cy="9.5" r="6" stroke="#B8862F"></circle></svg>openproduct</a>
</div>

<main style="flex: 1; min-height: 0; overflow-y: auto; box-sizing: border-box; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 10px">
<section aria-label="Sign in" style="flex-shrink: 0; background: radial-gradient(360px 160px at 100% 0%, rgba(227,179,76,0.24), transparent 70%), #FFFFFF; border-radius: 16px; padding: 22px 16px 16px; display: flex; flex-direction: column; gap: 14px">

<sc-if value="{{isStart}}" hint-placeholder-val="{{true}}">
<h1 style="margin: 0; font-family: Lora, Georgia, serif; font-weight: 400; font-size: 28px; line-height: 1.1; letter-spacing: -0.015em">Sign in</h1>
<a href="#" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; border-radius: 999px; background: #141413; color: #FAF9F5; text-decoration: none; font-weight: 600; font-size: 15px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E3B34C" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"></path><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"></path></svg>Continue with Orunbase</a>
<div aria-hidden="true" style="display: flex; align-items: center; gap: 12px">
<span style="flex: 1; height: 1px; background: rgba(20,20,19,0.06)"></span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.12em; color: #6B6A66">OR</span>
<span style="flex: 1; height: 1px; background: rgba(20,20,19,0.06)"></span>
</div>
<label style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; font-weight: 600">Email</span>
<input type="email" autocomplete="email" inputmode="email" value="{{email}}" onInput="{{setEmail}}" onKeyDown="{{onKey}}" placeholder="you@example.com" style="min-height: 48px; box-sizing: border-box; padding: 0 14px; border: 0; outline: 0; border-radius: 14px; background: #F7F5EF; color: #141413; font: inherit; font-size: 16px"></label>
<button type="button" onClick="{{send}}" disabled="{{notValid}}" style="{{sendStyle}}">Email me a sign-in link</button>
<a href="#" style="display: flex; align-items: center; justify-content: center; min-height: 44px; font-size: 13px; font-weight: 600; text-decoration: none">Create an account</a>
</sc-if>

<sc-if value="{{isSent}}" hint-placeholder-val="{{false}}">
<div style="width: 52px; height: 52px; border-radius: 50%; background: #F3E7CC; display: flex; align-items: center; justify-content: center; color: #8A6420"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg></div>
<h1 style="margin: 0; font-family: Lora, Georgia, serif; font-weight: 400; font-size: 28px; line-height: 1.1; letter-spacing: -0.015em">Check your inbox</h1>
<div role="status" style="display: flex; flex-direction: column; gap: 2px; color: #2B2A27">
<span>We sent a sign-in link to</span>
<span style="font-weight: 600; color: #141413; word-break: break-all">{{email}}</span>
</div>
<button type="button" onClick="{{back}}" style="display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; border: 0; border-radius: 999px; background: rgba(20,20,19,0.06); color: #141413; font: inherit; font-weight: 600; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>Use a different email</button>
</sc-if>

</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mode: 'start', email: '' }; }
  renderVals() {
    const email = this.state.email;
    const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim());
    const send = () => { if (valid) this.setState({ mode: 'sent', email: email.trim() }); };
    return {
      isStart: this.state.mode === 'start',
      isSent: this.state.mode === 'sent',
      email,
      notValid: !valid,
      setEmail: (e) => this.setState({ email: e.target.value }),
      onKey: (e) => { if (e.key === 'Enter') { e.preventDefault(); send(); } },
      send,
      back: () => this.setState({ mode: 'start' }),
      sendStyle: 'min-height: 48px; border: 0; border-radius: 999px; font: inherit; font-weight: 600; ' + (valid ? 'background: #F3E7CC; color: #5E4415; cursor: pointer' : 'background: rgba(20,20,19,0.06); color: #6B6A66; cursor: default')
    };
  }
}
</script>
</body>
</html>
