<!doctype html>
<html lang="en">
<head>

<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&amp;family=Lora:wght@400;500&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;display=swap">
<style>
@view-transition{navigation:auto}
.op-header{view-transition-name:op-header}
.op-page{view-transition-name:op-main}
.op-tab-line{position:absolute;left:0;right:0;bottom:5px;height:2px;border-radius:2px;background:#141413;view-transition-name:op-tabline}
.op-nav a:not([aria-current])::after{content:"";position:absolute;left:0;right:0;bottom:5px;height:2px;border-radius:2px;background:rgba(20,20,19,0.2);transform:scaleX(0);transition:transform .25s cubic-bezier(0.2, 0.8, 0.2, 1)}
.op-nav a:not([aria-current]):hover::after{transform:scaleX(1)}
::view-transition-group(op-tabline){animation-duration:.45s;animation-timing-function:cubic-bezier(0.2, 0.8, 0.2, 1)}
@media (prefers-reduced-motion: reduce){.op-nav a::after{transition:none}}

.op-header{font-family:'Geist','Hanken Grotesk',system-ui,sans-serif}
.op-header{position:relative;z-index:5;isolation:isolate}
.op-header::before{content:"";position:absolute;left:0;right:0;top:0;bottom:-10px;z-index:-1;pointer-events:none;background-image:linear-gradient(to bottom,rgba(255,255,255,0.4),rgba(255,255,255,0));-webkit-mask-image:linear-gradient(to bottom,#000 0,#000 calc(100% - 14px),transparent 100%);mask-image:linear-gradient(to bottom,#000 0,#000 calc(100% - 14px),transparent 100%);animation:op-shade linear both;animation-timeline:scroll(root block);animation-range:0 64px}
.op-scope{timeline-scope:--op-page}
.op-scroll{scroll-timeline:--op-page block}
.op-scope .op-header::before{animation-timeline:--op-page}
@keyframes op-shade{from{background-color:rgba(246,244,238,0.4);-webkit-backdrop-filter:saturate(140%) blur(8px);backdrop-filter:saturate(140%) blur(8px)}to{background-color:rgba(246,244,238,0.92);-webkit-backdrop-filter:saturate(170%) blur(24px);backdrop-filter:saturate(170%) blur(24px)}}
@supports not (animation-timeline: scroll()){.op-header::before{background-color:rgba(246,244,238,0.92);-webkit-backdrop-filter:saturate(170%) blur(24px);backdrop-filter:saturate(170%) blur(24px)}}

.op-pill{position:absolute;inset:0;border-radius:999px;background:#FFFFFF;box-shadow:inset 0 0 0 1px rgba(20,20,19,0.06);view-transition-name:op-pill;z-index:0}
.op-tab-pill{position:absolute;left:50%;top:-6px;width:18px;height:2px;margin-left:-9px;border-radius:2px;background:#141413;view-transition-name:op-pill;z-index:0}
.op-nav a,.op-icon,.op-tab{position:relative;transition:background-color .2s ease,color .2s ease}
.op-nav a>*:not(.op-pill),.op-icon>svg{position:relative;z-index:1}
.op-icon>span:not(.op-pill){z-index:2}
.op-icon{flex-shrink:0}
.op-nav a:not([aria-current]):hover,.op-icon:not([aria-current]):hover{color:#141413 !important}
.op-tab:not([aria-current]):hover{color:#141413 !important}
.op-nav a:focus-visible,.op-icon:focus-visible,.op-tab:focus-visible{outline:2px solid #B8862F;outline-offset:2px}
::view-transition-group(op-pill){animation-duration:.42s;animation-timing-function:cubic-bezier(0.2, 0.8, 0.2, 1)}
::view-transition-old(root){display:none}
::view-transition-new(root){animation:none}
::view-transition-group(op-main){animation:none}
::view-transition-old(op-main){animation:op-out .14s ease-out both}
::view-transition-new(op-main){animation:op-in .22s ease-out .04s both}

@keyframes op-out{to{opacity:0}}
@keyframes op-in{from{opacity:0}}
@media (prefers-reduced-motion: reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none !important}.op-nav a,.op-icon,.op-tab{transition:none}}
@media (max-width: 900px){.op-bar{display:flex !important;flex-wrap:wrap}}

:root{color-scheme:light}body{margin:0;background:#F6F4EE}
a{color:#8A6420}a:hover{color:#5E4415}
@media (prefers-reduced-motion: reduce){header *{transition-duration:0.01ms !important}}
</style>
</helmet>
<div style="background-color: #F6F4EE; background-image: radial-gradient(1100px 460px at 50% -8%, rgba(184,134,47,0.18), transparent 62%); background-attachment: fixed; color: #141413; font-family: 'Hanken Grotesk', system-ui, sans-serif; font-size: 15px; line-height: 1.5; min-height: 100%; display: flex; flex-direction: column">

<header class="op-header" style="position: sticky; top: 0; z-index: 5; width: 100%; background: transparent">
<div class="op-bar" style="max-width: 1920px; margin: 0 auto; box-sizing: border-box; padding: 6px 24px; min-height: 56px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 24px">
<a href="Feed.dc.html" style="justify-self: start; display: flex; align-items: center; gap: 10px; min-height: 40px; color: #141413; text-decoration: none; font-family: 'Geist', 'Hanken Grotesk', system-ui, sans-serif; font-weight: 600; font-size: 21px; letter-spacing: -0.035em">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3.5V21" stroke="#141413"></path><circle cx="14" cy="9.5" r="6" stroke="#B8862F"></circle></svg>openproduct</a>
<nav class="op-nav" aria-label="Main" style="justify-self: center; display: flex; align-items: center; gap: 36px">
<a href="Feed.dc.html" style="display: flex; align-items: center; min-height: 44px; color: #6B6A66; text-decoration: none; font-size: 16px; font-weight: 400; letter-spacing: -0.005em">Feed</a>
<a href="Products.dc.html" style="display: flex; align-items: center; min-height: 44px; color: #6B6A66; text-decoration: none; font-size: 16px; font-weight: 400; letter-spacing: -0.005em">Products</a>
<a href="Seats.dc.html" style="display: flex; align-items: center; min-height: 44px; color: #6B6A66; text-decoration: none; font-size: 16px; font-weight: 400; letter-spacing: -0.005em">Help wanted</a>
</nav>
<div style="justify-self: stretch; min-width: 0; display: flex; flex-wrap: nowrap; justify-content: flex-end; align-items: center; gap: 8px">
<div style="{{qWrap}}">
<label style="{{qLabel}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6A66" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<span style="position: absolute; left: -9999px">Search</span>
<input type="search" value="{{q}}" onInput="{{setQ}}" placeholder="Search products and people" style="border: 0; outline: 0; background: transparent; color: #141413; font: inherit; font-size: 15px; flex: 1; min-width: 0">
</label>
<div style="{{qCard}}">
<sc-for list="{{qRows}}" as="r" hint-placeholder-count="3">
<div style="{{r.wrap}}">
<a href="{{r.href}}" style="{{r.style}}"><span style="{{r.tile}}">{{r.mono}}</span><span style="flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span><span style="font-size: 13px; color: #6B6A66; flex-shrink: 0">{{r.kind}}</span></a>
<sc-if value="{{r.canExpand}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{r.toggle}}" aria-expanded="{{r.open}}" aria-label="{{r.toggleLabel}}" style="width: 40px; height: 40px; flex-shrink: 0; border: 0; border-radius: 50%; background: transparent; color: #6B6A66; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.chev}}"></path></svg></button></sc-if>
</div>
</sc-for>
<sc-if value="{{qNone}}" hint-placeholder-val="{{false}}"><div style="padding: 12px 10px; font-size: 13px; color: #6B6A66">No matches</div></sc-if>
<a href="Search.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 40px; margin-top: 2px; border-top: 1px solid rgba(20,20,19,0.06); font-size: 13px; font-weight: 600; text-decoration: none">See all results</a>
</div>
</div>
<a href="Activity.dc.html" aria-label="Activity" aria-current="page" class="op-icon" style="position: relative; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #141413">
<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 0112 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9zM10 20a2 2 0 004 0"></path></svg>
<sc-if value="{{anyUnread}}" hint-placeholder-val="{{true}}"><span aria-hidden="true" style="position: absolute; top: 7px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: #E3B34C; box-shadow: 0 0 0 2px #FAF9F5"></span></sc-if>
</a>
<a href="Me.dc.html" aria-label="Your profile" class="op-icon" style="position: relative; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #6B6A66">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg></a>
</div>
</div>
</header>

<div class="op-page" style="width: 100%; max-width: 1920px; margin: 0 auto; box-sizing: border-box; padding: 32px 24px 64px; display: flex; flex-direction: column; gap: 24px">

<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<h1 style="margin: 0; font-family: Lora, Georgia, serif; font-weight: 400; font-size: 40px; line-height: 1.1; letter-spacing: -0.015em">Activity</h1>
<button type="button" onClick="{{markAll}}" disabled="{{noUnread}}" style="{{markStyle}}">Mark all read</button>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">

<aside style="flex: 0 0 240px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<nav aria-label="Show" style="background: #FFFFFF; border-radius: 16px; box-shadow: none; padding: 10px; display: flex; flex-direction: column; gap: 2px">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #6B6A66; letter-spacing: 0.12em; padding: 6px 10px 8px">SHOW</div>
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button type="button" onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="{{t.style}}">
<span style="{{t.tile}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{t.stroke}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg></span>
<span style="flex: 1; text-align: left">{{t.label}}</span>
<span style="{{t.countStyle}}">{{t.count}}</span>
</button>
</sc-for>
</nav>
</aside>

<main style="flex: 999 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 20px">

<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<section aria-label="{{g.label}}" style="display: flex; flex-direction: column; gap: 8px">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.12em; color: #6B6A66; padding: 0 6px">{{g.mono}}</div>
<div style="background: #FFFFFF; border-radius: 16px; box-shadow: none; padding: 6px; display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
<div style="{{r.rowStyle}}">
<span style="{{r.tile}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{r.stroke}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.d}}"></path></svg></span>
<div style="flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 15px; color: #2B2A27"><a href="{{r.whoHref}}" style="color: #141413; font-weight: 600; text-decoration: none">{{r.who}}</a> {{r.text}} <a href="{{r.targetHref}}" style="color: #141413; font-weight: 600; text-decoration: none">{{r.target}}</a></div>
<sc-if value="{{r.hasQuote}}" hint-placeholder-val="{{false}}"><div style="font-size: 13px; color: #6B6A66; padding-left: 10px; border-left: 2px solid #ECEAE3">{{r.quote}}</div></sc-if>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #8A877F">{{r.when}}</span>
</div>
<sc-if value="{{r.hasLink}}" hint-placeholder-val="{{false}}"><a href="{{r.linkHref}}" style="display: flex; align-items: center; min-height: 40px; padding: 0 16px; border-radius: 999px; background: #141413; color: #FAF9F5; text-decoration: none; font-size: 13px; font-weight: 600">{{r.linkLabel}}</a></sc-if>
<sc-if value="{{r.pending}}" hint-placeholder-val="{{false}}">
<div style="display: flex; gap: 6px">
<button type="button" onClick="{{r.accept}}" style="min-height: 40px; padding: 0 16px; border: 0; border-radius: 999px; background: #141413; color: #FAF9F5; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Accept</button>
<button type="button" onClick="{{r.decline}}" style="min-height: 40px; padding: 0 16px; border: 0; border-radius: 999px; background: rgba(20,20,19,0.06); color: #2B2A27; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Decline</button>
</div>
</sc-if>
<sc-if value="{{r.decided}}" hint-placeholder-val="{{false}}"><span style="{{r.decidedStyle}}">{{r.decidedLabel}}</span></sc-if>
<span aria-label="{{r.dotLabel}}" style="{{r.dot}}"></span>
</div>
</sc-for>
</div>
</section>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{false}}"><div style="font-size: 15px; color: #6B6A66; padding: 0 6px">Nothing here yet.</div></sc-if>
</main>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1200}}'>
class Component extends DCLogic {
  constructor(props) {

  searchVals() {
    const q = (this.state || {}).q || '';
    const exp = (this.state || {}).qExp || {};
    const w = q.trim().toLowerCase();
    const open = !!w;
    const EASE = 'cubic-bezier(0.2, 0.8, 0.2, 1)';
    const P = [['ackstack', 'Ak', '#F3E7CC', '#8A6420', 1], ['meterwise', 'Mw', '#E6E9F2', '#3A4A75', 1], ['expirio', 'Ex', '#ECE6F3', '#5B3F86', 1], ['rangewise', 'Rw', '#E3EEE8', '#2F5E4C', 1], ['aitally', 'At', '#F0EEE6', '#2B2A27', 1], ['rateboard', 'Rb', '#DDEDEC', '#1F5357', 1], ['grantwell', 'Gw', '#E3EEE8', '#2F5E4C', 1], ['leakbook', 'Lb', '#E6E9F2', '#3A4A75', 1], ['arcdesk', 'Ad', '#ECEAE3', '#2B2A27', 1], ['beacon24', 'B2', '#ECE6F3', '#5B3F86', 0], ['chaseid', 'Ci', '#ECE6F3', '#5B3F86', 0]];
    const link = 'flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 10px; border-radius: 12px; color: #141413; text-decoration: none';
    const wrap = 'display: flex; align-items: center; gap: 2px';
    const prod = (p, child) => ({ href: p[4] ? 'Product.dc.html' : 'ProductIdea.dc.html', name: p[0], mono: p[1], kind: child ? 'Maker' : (p[4] ? 'Shipping' : 'Idea'), canExpand: false,
      wrap: wrap + (child ? '; margin-left: 24px; padding-left: 8px; border-left: 2px solid #ECEAE3' : ''), style: link,
      tile: 'width: ' + (child ? 26 : 30) + 'px; height: ' + (child ? 26 : 30) + 'px; border-radius: 9px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; background: ' + p[2] + '; color: ' + p[3] });
    const rows = [];
    if (w) {
      P.filter(p => p[0].includes(w)).slice(0, 3).forEach(p => rows.push(prod(p, false)));

        const name = '[Maker of ' + p[0] + ']', isOpen = !!exp[name];
        rows.push({ href: 'Person.dc.html', name, mono: 'M', kind: 'Person', wrap, style: link, canExpand: true, open: isOpen,

          toggle: () => this.setState({ qExp: { ...exp, [name]: !isOpen } }),
          tile: 'width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; background: #F0EEE6; color: #2B2A27' });
        if (isOpen) rows.push(prod(p, true));

      qLabel: 'position: relative; z-index: 21; flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; border-radius: 999px; padding: 0 16px; min-height: 42px; transition: background 0.25s ease, box-shadow 0.25s ease; ' + (open ? 'background: #F7F5EF; box-shadow: none' : 'background: rgba(20,20,19,0.045); box-shadow: none') };
  }
  renderVals() { return { ...this.pageVals(), ...this.searchVals() }; }
  pageVals() {
    const ICON = {

      reply: ['M4 5h16v11H9l-5 4z', '#5B6B8C', '#E6E9F2'],
      react: ['M9 18h6M10 21h4M12 3a6 6 0 00-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0012 3z', '#B8862F', '#F3E7CC'],
      follow: ['M9 11a4 4 0 100-8 4 4 0 000 8zM2 21c1-4 4-6 7-6s6 2 7 6M17 11l2 2 4-4', '#2F7A4E', '#E3EEE8'],
      seat: ['M9 11a4 4 0 100-8 4 4 0 000 8zM2 21c1-4 4-6 7-6s6 2 7 6M19 8v6M16 11h6', '#2F6F73', '#DDEDEC'],

      { id: 'a2', kind: 'seat', group: 'today', tabs: ['seats'], unread: true, who: '[Applicant]', whoHref: 'Person.dc.html', text: 'requested a seat on ackstack:', target: 'HR-compliance advisor', targetHref: 'Product.dc.html', when: '[3h]', seat: true },

    const tab = this.state.tab;
    const isUnread = (r) => r.unread && !this.state.read[r.id];
    const anyUnread = ROWS.some(isUnread);
    const TAB_ICON = { all: ['M4 6h16M4 12h16M4 18h10', '#141413', '#ECEAE3'], mentions: ['M4 5h16v11H9l-5 4z', '#5B6B8C', '#E6E9F2'], seats: ['M9 11a4 4 0 100-8 4 4 0 000 8zM2 21c1-4 4-6 7-6s6 2 7 6M19 8v6M16 11h6', '#2F6F73', '#DDEDEC'] };

      const n = ROWS.filter(r => k === 'all' || r.tabs.indexOf(k) >= 0).length;
      return { label, on, d, count: String(n), pick: () => this.setState({ tab: k }),
        stroke: on ? '#FFFFFF' : c,
        tile: 'width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: ' + (on ? c : tint),
        countStyle: 'font-family: IBM Plex Mono, monospace; font-size: 11px; color: ' + (on ? '#141413' : '#8A877F'),
        style: 'display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 10px; border: 0; border-radius: 14px; font: inherit; font-size: 15px; cursor: pointer; ' + (on ? 'background: #FFFFFF; color: #141413; font-weight: 600' : 'background: transparent; color: #2B2A27') };
    });
    const seat = this.state.seat;
    const toRow = (r) => {
      const [d, c, tint] = ICON[r.kind];
      const un = isUnread(r);
      return {
        who: r.who, whoHref: r.whoHref, text: r.text, target: r.target, targetHref: r.targetHref, when: r.when, d, stroke: c,
        hasQuote: !!r.quote, quote: r.quote || '',
        hasLink: !!r.link, linkLabel: r.link ? r.link[0] : '', linkHref: r.link ? r.link[1] : '#',
        pending: !!r.seat && !seat, decided: !!r.seat && !!seat,
        decidedLabel: seat === 'accepted' ? 'Accepted' : 'Declined',
        decidedStyle: 'font-size: 13px; font-weight: 600; color: ' + (seat === 'accepted' ? '#2F7A4E' : '#6B6A66'),
        accept: () => this.setState({ seat: 'accepted', read: { ...this.state.read, [r.id]: true } }),
        decline: () => this.setState({ seat: 'declined', read: { ...this.state.read, [r.id]: true } }),
        dotLabel: un ? 'Unread' : '',
        dot: 'width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: ' + (un ? '#E3B34C' : 'transparent') + (un ? '; box-shadow: none' : ''),
        tile: 'width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: ' + tint,
        rowStyle: 'display: flex; flex-wrap: wrap; align-items: center; gap: 12px 14px; padding: 12px 14px; border-radius: 14px; ' + (un ? 'background: #FBF8F0' : 'background: transparent')
      };
    };
    const shown = ROWS.filter(r => tab === 'all' || r.tabs.indexOf(tab) >= 0);
    const groups = [['today', 'Today', 'TODAY'], ['earlier', 'Earlier', 'EARLIER']]
      .map(([k, label, mono]) => ({ label, mono, rows: shown.filter(r => r.group === k).map(toRow) }))
      .filter(g => g.rows.length > 0);
    return {
      tabs, groups, empty: groups.length === 0, anyUnread, noUnread: !anyUnread,
      markAll: () => { const read = { ...this.state.read }; ROWS.forEach(r => { read[r.id] = true; }); this.setState({ read }); },
      markStyle: 'min-height: 40px; padding: 0 18px; border: 0; border-radius: 999px; font: inherit; font-size: 13px; font-weight: 600; ' + (anyUnread ? 'background: rgba(20,20,19,0.06); color: #141413; cursor: pointer' : 'background: rgba(20,20,19,0.03); color: #A8A59C; cursor: default')
    };
  }
}
</script>
