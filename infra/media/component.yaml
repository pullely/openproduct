apiVersion: sourceplane.io/v1
kind: Component

metadata:
  name: openproduct-media
  title: openproduct media bucket
  description: Terraform for openproduct's own R2 bucket per environment (stage, prod) holding listing media, bound to the gateway as MEDIA.
  labels:
    domain: infra
    scope: media-object-store
    surface: openproduct

spec:
  type: terraform
  lifecycle: production
  owner: platform
  domain: infra
  system: openproduct
  docs:
    overview: README.md

  # THE FIRST DATA RESOURCE OPENPRODUCT HAS TAKEN SINCE OX5 gave it its own
  # data plane, and the binding allowlist test on the gateway exists precisely
  # so that taking one is a deliberate, reviewed act rather than a line in a
  # config nobody read — which is how RS0's missing cron happened (MD-4).
  #
  # It is openproduct's bucket, never a platform binding (OPX-4). The
  # gateway binds it by NAME (R2 binds by name, not id), committed in its
  # wrangler.jsonc, so this component publishes nothing (the monorepo's
  # Secrets Manager wiring manifest had no reader and is gone, design §11).
  parameters:
    orgName: sourceplane
    owner: pullely
    repo: openproduct
    stackName: openproduct-media
    terraformDir: terraform
    terraformVersion: "1.15.3"

  # From the project/<env> rung, brokered from the openproduct Cloudflare
  # connection (int_7fbdaafa…). CLOUDFLARE_R2_TOKEN is the r2-data template
  # (Workers R2 Storage Write); the workers-deploy token has no R2 permission.
  # Component-level, because plan-only refreshes against the live API too.
  secretEnv:
    CLOUDFLARE_API_TOKEN: "secret://ws_VTNEQKAP/openproduct/{{ .environment }}/CLOUDFLARE_R2_TOKEN"
    CLOUDFLARE_ACCOUNT_ID: "secret://ws_VTNEQKAP/openproduct/{{ .environment }}/CLOUDFLARE_ACCOUNT_ID"
    TF_VAR_cloudflare_account_id: "secret://ws_VTNEQKAP/openproduct/{{ .environment }}/CLOUDFLARE_ACCOUNT_ID"

  subscribe:
    # STAGE AND PROD ONLY, like `cloudflare-r2`'s orun-state buckets: the
    # gateway's dev environment binds no bucket (a binding to a bucket that
    # does not exist is a deploy that fails), so no dev bucket is made.
    environments:
      - name: stage
        dependencyRules: # PRs don't wait on other lanes (intent.yaml, environments)
          - mode: advisory
            when:
              triggerRef: github-pull-request
        profile: plan-only
        profileRules:
          - profile: apply
            when:
              triggerRef: github-push-main
          - profile: apply # manual runs from Orunbase
            when:
              triggerRef: github-dispatch

      - name: prod
        dependencyRules: # PRs don't wait on other lanes (intent.yaml, environments)
          - mode: advisory
            when:
              triggerRef: github-pull-request
        profile: plan-only
        profileRules:
          - profile: apply
            when:
              triggerRef: github-push-main
          - profile: apply # manual runs from Orunbase
            when:
              triggerRef: github-dispatch

# Prerequisite: R2 is enabled on the openproduct Cloudflare account. THE PLAN
# CANNOT SEE IT: OPN-8's first apply planned cleanly, then failed at create
# with "Please enable R2 through the Cloudflare Dashboard" (10042). It is a
# dashboard step for the owner, done on 2026-11-12. Image
# Resizing, which MD1's derivatives use, is a ZONE feature this component does
# not touch: it is enabled in the dashboard for the zone that serves the
# gateway, and the gateway's `MEDIA_RESIZING` var is flipped to "true" there
# once it is. Until then the original serves at every width.
