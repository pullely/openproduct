apiVersion: sourceplane.io/v1
kind: Component

metadata:
  name: openproduct-hyperdrive
  title: openproduct Hyperdrive
  description: Terraform for openproduct's own Cloudflare Hyperdrive config per environment, over its own Supabase project. The result is published as the WIRING_OPENPRODUCT_HYPERDRIVE secret for core's deploy.
  labels:
    domain: infra
    scope: runtime-database-gateway
    surface: openproduct

spec:
  type: terraform
  lifecycle: production
  owner: platform
  domain: infra
  system: openproduct
  docs:
    overview: README.md

  # Taken from orun-cloud ffb71be69 (apps/openproduct/infra/hyperdrive) as it
  # is, except for what this repository forces (design §11): state lives on
  # the platform, the origin comes from the secrets openproduct-supabase
  # publishes instead of Secrets Manager, and the wiring manifest is published
  # as a secret instead of written to Secrets Manager. So, no AWS.
  #
  # Ordering only: in a run that holds both, this applies after
  # openproduct-supabase. A `--changed` plan schedules this component only
  # when its own files change.
  dependsOn:
    - component: openproduct-supabase

  parameters:
    orgName: sourceplane
    owner: pullely
    repo: openproduct
    stackName: openproduct-hyperdrive
    terraformDir: terraform
    terraformVersion: "1.15.3"
    # After apply, the wiring document (hyperdrive id and name) is published
    # to this environment's secrets over the job's lease. core's deploy reads
    # it back as WIRING_OPENPRODUCT_HYPERDRIVE_<ENV> and renders its
    # @@wiring(openproduct-hyperdrive/<env>:hyperdrive_id)@@ tokens from it.
    secretOutputs: "WIRING_OPENPRODUCT_HYPERDRIVE=wiring"

  # All from the project/<env> rung. The provider credential is brokered from
  # the openproduct Cloudflare connection (int_7fbdaafa…) with the
  # hyperdrive-edit template, because the workers-deploy token cannot touch
  # Hyperdrive. The account id is a non-secret connection fact (account-id).
  # The origin is the pair openproduct-supabase publishes after its apply.
  # Component-level, because plan-only refreshes against the live API too.
  secretEnv:
    CLOUDFLARE_API_TOKEN: "secret://ws_VTNEQKAP/openproduct/{{ .environment }}/CLOUDFLARE_HYPERDRIVE_TOKEN"
    CLOUDFLARE_ACCOUNT_ID: "secret://ws_VTNEQKAP/openproduct/{{ .environment }}/CLOUDFLARE_ACCOUNT_ID"
    TF_VAR_cloudflare_account_id: "secret://ws_VTNEQKAP/openproduct/{{ .environment }}/CLOUDFLARE_ACCOUNT_ID"
    TF_VAR_supabase_project_ref: "secret://ws_VTNEQKAP/openproduct/{{ .environment }}/SUPABASE_PROJECT_REF"
    TF_VAR_supabase_db_password: "secret://ws_VTNEQKAP/openproduct/{{ .environment }}/SUPABASE_DB_PASSWORD"

  # Plan on pull requests, apply on the merge to main: stage, then prod.
  subscribe:
    environments:
      - name: stage
        profile: plan-only
        profileRules:
          - profile: apply
            when:
              triggerRef: github-push-main

      - name: prod
        profile: plan-only
        profileRules:
          - profile: apply
            when:
              triggerRef: github-push-main
