apiVersion: sourceplane.io/v1
kind: Component

metadata:
  name: cloudflare-d1-probe
  title: openproduct D1 probe database (retired)
  description: Retires the D1 trial on stage. It declares no database, so its apply destroys openproduct-probe-stage and deletes the openproduct-d1-probe-stage Worker (OPN-5, after OPN1's no-go for D1).
  labels:
    domain: infra
    scope: probe-database
    surface: openproduct

spec:
  type: terraform
  lifecycle: experimental
  owner: platform
  domain: infra
  system: openproduct

  parameters:
    orgName: sourceplane
    owner: pullely
    repo: openproduct
    stackName: cloudflare-d1-probe
    terraformDir: terraform
    terraformVersion: "1.15.3"
    # No secretOutputs: there is no database left to publish wiring for.

  # The Cloudflare provider authenticates via CLOUDFLARE_API_TOKEN, resolved by
  # orun from the project/stage secret CLOUDFLARE_D1_TOKEN (Cloudflare D1
  # Edit): it destroys the database. Declared at component level because the
  # plan-only lane refreshes against the live Cloudflare API too, not just
  # apply. CLOUDFLARE_WORKERS_TOKEN is the workers-deploy token, used only by
  # the apply-time call that deletes the probe Worker.
  secretEnv:
    CLOUDFLARE_API_TOKEN: "secret://ws_VTNEQKAP/openproduct/{{ .environment }}/CLOUDFLARE_D1_TOKEN"
    CLOUDFLARE_WORKERS_TOKEN: "secret://ws_VTNEQKAP/openproduct/{{ .environment }}/CLOUDFLARE_API_TOKEN"
    # Non-secret connection fact.
    CLOUDFLARE_ACCOUNT_ID: "secret://ws_VTNEQKAP/openproduct/{{ .environment }}/CLOUDFLARE_ACCOUNT_ID"
    TF_VAR_cloudflare_account_id: "secret://ws_VTNEQKAP/openproduct/{{ .environment }}/CLOUDFLARE_ACCOUNT_ID"

  # STAGE ONLY, as the probe always was: terraform/main.tf refuses any other
  # environment. Plan on pull requests (it shows the destroy), apply on the
  # merge to main (it does it).
  subscribe:
    environments:
      - name: stage
        profile: plan-only
        profileRules:
          - profile: apply
            when:
              triggerRef: github-push-main
